<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectrum Lens — Audio Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>◢ spectrum lens</h1>
  <nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav>
</header>
<main>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="start" id="start">
      <div class="mic">🎙</div>
      <button id="go" data-i="start">Start microphone</button>
      <p data-i="privacy">Audio is processed locally in your browser — nothing is recorded or uploaded.</p>
    </div>
  </div>
  <div class="panel">
    <label><span data-i="sens">Sensitivity</span><input type="range" id="sens" min="1" max="5" step="0.5" value="2"></label>
    <label><span data-i="smooth">Smoothing</span><input type="range" id="smooth" min="0" max="0.95" step="0.05" value="0.8"></label>
    <label class="check"><input type="checkbox" id="wave" checked> <span data-i="waveform">Waveform overlay</span></label>
    <label class="check"><input type="checkbox" id="peaks" checked> <span data-i="peaks">Peak hold</span></label>
    <div class="note"><span data-i="dominant">Dominant</span>: <b id="note">—</b> <span id="freq"></span></div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
